<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Eduardo Pacheco - Ciencia de Datos e Inteligencia Artificial</title>
  <desc id="svg-desc">Banner de perfil con motivo de microchip de IA y trazas de circuito: los datos entran al chip y salen como resultado. Fondo azul marino con acentos turquesa.</desc>

  <!-- Fondo -->
  <rect width="1200" height="320" fill="#0A1929"/>

  <!-- Marca: cuadrícula 2x2 -->
  <rect x="64" y="84" width="10" height="10" rx="2" fill="#4FD1C5"/>
  <rect x="80" y="84" width="10" height="10" rx="2" fill="#2C4A66"/>
  <rect x="64" y="100" width="10" height="10" rx="2" fill="#2C4A66"/>
  <rect x="80" y="100" width="10" height="10" rx="2" fill="#4FD1C5"/>

  <!-- Título -->
  <text x="64" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#E6EDF3">Eduardo Pacheco</text>

  <!-- Subtítulo: dirección de carrera -->
  <text x="64" y="228" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="28" fill="#4FD1C5">Ciencia de Datos e Inteligencia Artificial</text>

  <!-- Subtítulo: identidad técnica -->
  <text x="64" y="262" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" fill="#8FA8C4">Python · Backend · Datos</text>

  <!-- Motivo: microchip de IA con flujo de datos -->
  <!-- Nodo de entrada -->
  <circle cx="862" cy="189" r="5" fill="#4FD1C5"/>
  <line x1="868" y1="189" x2="952" y2="189" stroke="#4FD1C5" stroke-width="3"/>

  <!-- Pines izquierdos -->
  <rect x="952" y="148" width="10" height="10" fill="#2C4A66"/>
  <rect x="952" y="166" width="10" height="10" fill="#2C4A66"/>
  <rect x="952" y="184" width="10" height="10" fill="#2C4A66"/>
  <rect x="952" y="202" width="10" height="10" fill="#2C4A66"/>

  <!-- Cuerpo del chip -->
  <rect x="962" y="138" width="140" height="84" rx="8" fill="#14304A" stroke="#2C4A66" stroke-width="1.5"/>

  <!-- Núcleo (die) -->
  <rect x="1012" y="160" width="40" height="40" rx="3" fill="#0A1929" stroke="#4FD1C5" stroke-width="1.5"/>

  <!-- Traza interna del núcleo -->
  <path d="M1022 190 L1032 190 L1032 170 L1042 170" fill="none" stroke="#4FD1C5" stroke-width="1.5"/>

  <!-- Pines derechos -->
  <rect x="1102" y="148" width="10" height="10" fill="#2C4A66"/>
  <rect x="1102" y="166" width="10" height="10" fill="#2C4A66"/>
  <rect x="1102" y="184" width="10" height="10" fill="#2C4A66"/>
  <rect x="1102" y="202" width="10" height="10" fill="#2C4A66"/>

  <!-- Nodo de salida -->
  <line x1="1112" y1="189" x2="1142" y2="189" stroke="#4FD1C5" stroke-width="3"/>
  <circle cx="1152" cy="189" r="5" fill="#4FD1C5"/>

  <!-- Línea base -->
  <rect x="64" y="292" width="1072" height="1" fill="#1E3A57"/>
</svg>
